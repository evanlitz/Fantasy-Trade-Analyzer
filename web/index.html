<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger — Dynasty Trade Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span class="mark">Ledger</span>
    <nav class="nav"><a href="/" aria-current="page">Trade</a><a href="/league.html">League</a></nav>
    <span class="meta">1QB · PPR · consensus of 8 sources · values built <span id="built">…</span></span>
  </header>

  <main class="calc" data-mode="league">
    <div class="calc-bar">
      <div class="mode" role="group" aria-label="Calculator mode">
        <button type="button" data-mode="league" aria-pressed="true">League <span class="league-name"></span></button>
        <button type="button" data-mode="free" aria-pressed="false">Any player</button>
      </div>
      <span class="calc-note"></span>
      <button type="button" class="clear">Clear</button>
    </div>

    <section class="side" data-side="a">
      <div class="side-head">
        <span class="side-label">Team A gets</span>
        <span class="team-select"><select class="team-pick" aria-label="Team A"></select></span>
        <span class="side-tier"></span>
        <span class="side-rec"></span>
        <span class="side-verb">sends</span>
      </div>
      <div class="search">
        <input type="text" placeholder="Search players and picks" autocomplete="off" spellcheck="false">
        <ul class="results" hidden></ul>
      </div>
      <ol class="rows"></ol>
      <div class="totals"><span class="pieces"></span><span class="total num"></span></div>
      <details class="browse" hidden>
        <summary></summary>
        <div class="browse-body"></div>
      </details>
    </section>

    <section class="side" data-side="b">
      <div class="side-head">
        <span class="side-label">Team B gets</span>
        <span class="team-select"><select class="team-pick" aria-label="Team B"></select></span>
        <span class="side-tier"></span>
        <span class="side-rec"></span>
        <span class="side-verb">sends</span>
      </div>
      <div class="search">
        <input type="text" placeholder="Search players and picks" autocomplete="off" spellcheck="false">
        <ul class="results" hidden></ul>
      </div>
      <ol class="rows"></ol>
      <div class="totals"><span class="pieces"></span><span class="total num"></span></div>
      <details class="browse" hidden>
        <summary></summary>
        <div class="browse-body"></div>
      </details>
    </section>

    <section class="result">
      <div class="balance"><div class="fair-zone"></div><div class="fill"></div></div>
      <div class="verdict">
        <p class="verdict-text"></p>
      </div>
      <div class="even" hidden>
        <h3 class="even-head"></h3>
        <ol class="even-rows"></ol>
      </div>
    </section>

    <section class="impact" hidden>
      <h3 class="section-head">Team impact <span>both rosters re-scored with the trade · win-now = simulated weekly lineup, dynasty = all assets star-curved</span></h3>
      <div class="impact-grid">
        <div class="impact-team" data-side="a"></div>
        <div class="impact-team" data-side="b"></div>
      </div>
    </section>
  </main>

  <script src="impact.js"></script>
  <script src="app.js"></script>
</body>
</html>
